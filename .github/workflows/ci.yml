name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

  smoke-cli:
    name: CLI smoke (templates / generate / validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: CLI surface
        run: |
          hermes-skins version
          hermes-skins templates
          hermes-skins generate asuka --output /tmp/asuka.yaml
          hermes-skins validate /tmp/asuka.yaml
          hermes-skins custom myskin --color "#FF6D00" --harmony triadic --output /tmp/myskin.yaml
          hermes-skins validate /tmp/myskin.yaml
