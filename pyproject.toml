[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-skins"
version = "0.2.0"
description = "Independent skin engine and generator for Hermes Agent CLI — own schema, color-theory generators, random skin creation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "andywongpt-my" }
]
keywords = ["hermes", "skins", "theme", "cli", "terminal", "evangelion", "color-theory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Terminals",
]
dependencies = [
    "pyyaml>=6.0",
    "typer>=0.9",
]

[project.scripts]
hermes-skins = "hermes_skins.cli:app"

[project.urls]
Homepage = "https://github.com/andywongpt-my/hermes-skins-engine"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# src layout: pytest must find hermes_skins even without `pip install -e .`
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_skins"]